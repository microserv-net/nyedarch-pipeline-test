[package]
name = "nyedarch-package"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Builder-only: filesystem walking + package construction. The RUNTIME must
# NEVER enable this (correction pass §7) — it would ship package-construction
# capability into a hostile-environment binary.
builder = []

[dependencies]
nyedarch-crypto = { path = "../nyedarch-crypto" }
nyedarch-core = { path = "../nyedarch-core" }
serde = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
# Pure-Rust DEFLATE (low MSRV). Production adds zstd/lz4 modes behind the

miniz_oxide = "0.8"
# zstd: better ratio and throughput than DEFLATE. Selected per package and
# recorded in the header, so older packages keep opening (spec §59).
zstd = { version = "0.13", default-features = false }


[dev-dependencies]
nyedarch-package = { path = ".", features = ["builder"] }
