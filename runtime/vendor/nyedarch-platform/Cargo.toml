[package]
name = "nyedarch-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# Platform capability shared by BOTH sides (spec §41 platform abstraction).
# Location acquisition is needed by the builder (to capture the authorized
# region) and by the runtime (to prove it). Keeping it here avoids the builder
# depending on the runtime, or the runtime depending on the builder (§29).
[dependencies]
nyedarch-crypto = { path = "../nyedarch-crypto" }
getrandom = { workspace = true }

[features]
# CoreLocation on macOS.
#
# On by default so a bundled macOS application gets the native provider. If it
# fails to build in your environment, disable it with
# `--no-default-features` and the browser consent flow handles location
# instead - nothing else depends on it.
default = ["macos-corelocation"]
macos-corelocation = ["dep:objc2-core-location"]

# Declared per-target so no other platform pulls Objective-C bindings.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-location = { version = "0.3", optional = true, features = ["CLLocation", "CLLocationManager"] }
