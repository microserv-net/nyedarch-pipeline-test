[package]
name = "nyedarch-crypto"
description = "NYEDArch security-critical cryptographic core: factor composition, AEAD, memory-hard KDF."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# Authenticated encryption. XChaCha20-Poly1305: 192-bit random nonces (safe to
# generate randomly), misuse-resistant nonce space, no hardware AES dependency.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# Memory-hard passphrase KDF (spec §18 / §20). Argon2id, the established primitive.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Domain-separated key derivation / expansion (spec §25 / §54).
hkdf = "0.12"
sha2 = "0.10"
# Secret hygiene (spec §55/§56).
zeroize = { version = "1", features = ["derive"] }
# Constant-time comparisons (spec §7 fingerprint compare, §30 no oracles).
subtle = "2.5"
# OS CSPRNG binding — OPTIONAL. The crypto core itself makes no OS calls;
# randomness is an injected trait (correction pass §8).
getrandom = { version = "0.2", optional = true }
thiserror = "1"

[features]
default = ["os-rng"]
# Binds `RandomSource` to the OS CSPRNG. Disable to audit/build the
# confidentiality boundary with zero platform surface.
os-rng = ["dep:getrandom"]

[dev-dependencies]
hex = "0.4"
