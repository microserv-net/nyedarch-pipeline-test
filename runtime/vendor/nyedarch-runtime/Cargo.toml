[package]
name = "nyedarch-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
nyedarch-crypto = { path = "../nyedarch-crypto" }
nyedarch-core = { path = "../nyedarch-core" }
nyedarch-package = { path = "../nyedarch-package" }
nyedarch-fingerprint = { path = "../nyedarch-fingerprint" }
nyedarch-platform = { path = "../nyedarch-platform" }
zeroize = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }

[dev-dependencies]
# Builder capability is dev-only: needed to CONSTRUCT packages for the negative
# tests. It is never enabled for the shipped runtime (correction pass §7).
nyedarch-package = { path = "../nyedarch-package", features = ["builder"] }
nyedarch-crypto = { path = "../nyedarch-crypto" }
