# Generated NYEDArch capsule project. Self-contained: the runtime crates
# are vendored under vendor/ so this builds anywhere cargo runs.
#
# The vendored crates inherit fields from a workspace root, so this project
# declares that root itself. Without it, cargo cannot resolve
# `edition.workspace = true` on a machine that has no NYEDArch source tree.
[workspace]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"
authors = ["NYEDArch"]
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"

[package]
name = "nyedarch-capsule-bbe8e954ca0288aa"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "nyedarch-capsule"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
nyedarch-runtime = { path = "vendor/nyedarch-runtime" }
nyedarch-crypto  = { path = "vendor/nyedarch-crypto" }
zeroize = { version = "1", features = ["derive"] }
