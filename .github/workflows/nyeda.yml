name: nyedarch-capsule-build
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-14, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (latest stable, auto per spec §69)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build capsule (release, hardened profile)
        working-directory: runtime
        env:
          # Repository secrets are injected by the Actions runner and masked in
          # logs. They are never printed by this workflow (spec §48).
          NYEDARCH_GH_TO_CLIENT_PUB: ${{ secrets.NYEDARCH_GH_TO_CLIENT_PUB }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage capsule as .nyarch
        shell: bash
        working-directory: runtime
        run: |
          mkdir -p ../out
          bin="target/${{ matrix.target }}/release/nyedarch-capsule"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          # One extension on every OS (spec: NYEDArch capsule identity).
          out="../out/nyedarch-${{ github.run_id }}-${{ matrix.target }}.nyarch"
          cp "$bin" "$out"
          # Executable bit. Preserved by upload-artifact v4 on Unix runners;
          # Windows has no execute bit, so this is a no-op there by design.
          chmod +x "$out" || true
          ls -l "$out"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyedarch-capsule-${{ matrix.target }}
          path: out/*.nyarch
          if-no-files-found: error
