name: nyedarch-macos-diagnostic
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diag:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build and capture any error
        working-directory: runtime
        run: |
          set +e
          cargo build --release --target aarch64-apple-darwin > /tmp/out.txt 2>&1
          echo "exit=$?" >> /tmp/out.txt
          set -e
      - name: Publish the captured output back to the repository
        run: |
          mkdir -p diag
          tail -c 60000 /tmp/out.txt > diag/macos-build.txt
          git config user.name  "nyedarch-diagnostic"
          git config user.email "diag@nyedarch.invalid"
          git add diag/macos-build.txt
          git commit -m "diagnostic: macOS build output" || echo "nothing to commit"
          git push
